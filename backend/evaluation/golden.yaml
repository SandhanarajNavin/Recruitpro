# Golden set for search-quality evaluation (architecture doc §27).
#
# Grades:
#   2  strong match — you would shortlist this person
#   1  partial      — plausible, worth a look
#   0  not relevant — should not surface
#
# Only list candidates you have judged. Anyone omitted is treated as grade 0, so a
# job with no relevant candidates is a legitimate and useful entry — it tests that
# the system does NOT surface people confidently.
#
# Names are matched case-insensitively against candidates you own. Names rather than
# UUIDs so this file stays hand-editable and survives a database reset.
#
# ── IMPORTANT ────────────────────────────────────────────────────────────────
# These grades were drafted from profile summaries, not by reading the resumes.
# They are a starting point to be corrected, not ground truth. A golden set is only
# worth what the judgement in it is worth.
# ─────────────────────────────────────────────────────────────────────────────

